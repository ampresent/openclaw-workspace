[package]
name = "runb"
version = "0.1.0"
edition = "2024"
description = "A lightweight OCI-compatible container runtime using chroot only"

[[bin]]
name = "runb"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.30", features = ["mount", "signal", "process", "dir", "fs"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
