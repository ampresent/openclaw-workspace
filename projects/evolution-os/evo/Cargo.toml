[package]
name = "evo"
version = "0.1.0"
edition = "2021"
description = "Evolution OS CLI - source-driven, AI-assisted meta-operating system"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
indicatif = "0.17"
ratatui = "0.29"
crossterm = "0.28"
