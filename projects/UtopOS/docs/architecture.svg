<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="'Inter','SF Pro','Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="gUser" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#667eea"/><stop offset="100%" stop-color="#764ba2"/></linearGradient>
    <linearGradient id="gAgent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f093fb"/><stop offset="100%" stop-color="#f5576c"/></linearGradient>
    <linearGradient id="gMCP" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4facfe"/><stop offset="100%" stop-color="#00f2fe"/></linearGradient>
    <linearGradient id="gAgent2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#43e97b"/><stop offset="100%" stop-color="#38f9d7"/></linearGradient>
    <linearGradient id="gNixOS" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fa709a"/><stop offset="100%" stop-color="#fee140"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7z" fill="#64748b"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="620" rx="20" fill="#0f172a"/>

  <!-- Title -->
  <text x="400" y="48" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">UtopOS 架构</text>
  <text x="400" y="72" text-anchor="middle" fill="#94a3b8" font-size="13">AI Agent ↔ NixOS 的人话接口</text>

  <!-- ===== Box 1: User ===== -->
  <rect x="280" y="95" width="240" height="68" rx="14" fill="url(#gUser)" filter="url(#shadow)"/>
  <text x="400" y="124" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">👤 用户</text>
  <text x="400" y="146" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12">"nginx 502 了"</text>

  <!-- Arrow: User → Agent -->
  <line x1="400" y1="163" x2="400" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="418" y="188" fill="#94a3b8" font-size="10">自然语言</text>

  <!-- ===== Box 2: Claude Code ===== -->
  <rect x="230" y="205" width="340" height="68" rx="14" fill="url(#gAgent)" filter="url(#shadow)"/>
  <text x="400" y="234" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">🤖 Claude Code / AI Agent</text>
  <text x="400" y="256" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12">本地运行 · 诊断 · 生成修复方案</text>

  <!-- Arrow: Agent → MCP -->
  <line x1="400" y1="273" x2="400" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="418" y="298" fill="#94a3b8" font-size="10">MCP stdio (JSON-RPC 2.0)</text>

  <!-- ===== Box 3: MCP Server ===== -->
  <rect x="230" y="315" width="340" height="68" rx="14" fill="url(#gMCP)" filter="url(#shadow)"/>
  <text x="400" y="344" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">🔗 UtopOS MCP Server</text>
  <text x="400" y="366" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12">本地运行 · 协议翻译 · 风险评估</text>

  <!-- MCP Tools sidebar -->
  <rect x="590" y="310" width="180" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="680" y="332" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">MCP Tools</text>
  <text x="680" y="350" text-anchor="middle" fill="#64748b" font-size="10">system_snapshot</text>
  <text x="680" y="365" text-anchor="middle" fill="#64748b" font-size="10">config_validate</text>
  <text x="680" y="380" text-anchor="middle" fill="#64748b" font-size="10">config_apply / rollback</text>
  <line x1="570" y1="350" x2="590" y2="350" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>

  <!-- Arrow: MCP → Agent -->
  <line x1="400" y1="383" x2="400" y2="420" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="418" y="408" fill="#94a3b8" font-size="10">HTTP / SSH 隧道</text>

  <!-- ===== Box 4: UtopOS-agent ===== -->
  <rect x="230" y="425" width="340" height="68" rx="14" fill="url(#gAgent2)" filter="url(#shadow)"/>
  <text x="400" y="454" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="600">⚙️ UtopOS-agent</text>
  <text x="400" y="476" text-anchor="middle" fill="rgba(15,23,42,0.7)" font-size="12">NixOS 服务器 · REST API · 执行操作</text>

  <!-- Agent API sidebar -->
  <rect x="30" y="420" width="180" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="120" y="442" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">API Endpoints</text>
  <text x="120" y="460" text-anchor="middle" fill="#64748b" font-size="10">GET /api/snapshot</text>
  <text x="120" y="475" text-anchor="middle" fill="#64748b" font-size="10">POST /api/config/apply</text>
  <text x="120" y="490" text-anchor="middle" fill="#64748b" font-size="10">POST /api/rollback</text>
  <line x1="210" y1="460" x2="230" y2="460" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>

  <!-- Arrow: Agent → NixOS -->
  <line x1="400" y1="493" x2="400" y2="530" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="418" y="518" fill="#94a3b8" font-size="10">systemctl · nixos-rebuild</text>

  <!-- ===== Box 5: NixOS ===== -->
  <rect x="255" y="535" width="290" height="60" rx="14" fill="url(#gNixOS)" filter="url(#shadow)"/>
  <text x="400" y="562" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">❄️ NixOS 系统</text>
  <text x="400" y="582" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="12">configuration.nix · nixpkgs · generations</text>

  <!-- Host boundary -->
  <rect x="218" y="85" width="365" height="522" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6"/>
  <text x="230" y="100" fill="#475569" font-size="10">本地机器</text>

  <rect x="218" y="413" width="365" height="195" rx="16" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="6" opacity="0.5"/>
  <text x="230" y="428" fill="#059669" font-size="10">NixOS 服务器</text>
</svg>
