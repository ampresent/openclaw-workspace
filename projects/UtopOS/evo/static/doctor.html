<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nix-evo — Nix Doctor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e17;--card:#131a2b;--border:#1e2a3f;--text:#e2e8f0;--muted:#64748b;--green:#10b981;--yellow:#f59e0b;--orange:#f97316;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6;--cyan:#06b6d4}
body{font-family:'SF Mono','Cascadia Code','Fira Code',monospace;background:var(--bg);color:var(--text);padding:24px;min-height:100vh}
h1{font-size:1.5rem;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.subtitle{color:var(--muted);font-size:0.8rem;margin-bottom:24px}
.input-area{margin-bottom:20px}
.input-area textarea{width:100%;min-height:160px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px;border-radius:8px;font-family:inherit;font-size:0.85rem;resize:vertical;line-height:1.6}
.input-area textarea::placeholder{color:var(--muted)}
.input-row{display:flex;gap:10px;margin-top:10px;align-items:center}
.context-input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;font-family:inherit;font-size:0.8rem}
.btn{background:var(--blue);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:0.85rem;font-weight:600;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:var(--border);color:var(--text)}
.kb-stats{display:flex;gap:16px;margin-bottom:20px;font-size:0.8rem;color:var(--muted)}
.kb-stats span{background:var(--card);padding:4px 10px;border-radius:4px;border:1px solid var(--border)}
.results{display:none}
.no-match{text-align:center;padding:40px;color:var(--muted)}
.no-match .big-emoji{font-size:3rem;margin-bottom:12px}
.matches{display:flex;flex-direction:column;gap:14px}
.match{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;border-left:4px solid var(--border)}
.match.critical{border-left-color:var(--red)}.match.high{border-left-color:var(--orange)}.match.medium{border-left-color:var(--yellow)}.match.low{border-left-color:var(--blue)}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.match-title{font-size:1rem;font-weight:600}
.severity-badge{padding:2px 10px;border-radius:12px;font-size:0.7rem;font-weight:600;text-transform:uppercase}
.severity-badge.critical{background:rgba(239,68,68,.2);color:var(--red)}.severity-badge.high{background:rgba(249,115,22,.2);color:var(--orange)}.severity-badge.medium{background:rgba(245,158,11,.2);color:var(--yellow)}.severity-badge.low{background:rgba(59,130,246,.2);color:var(--blue)}
.confidence{font-size:0.75rem;color:var(--cyan);margin-left:8px}
.match-meta{display:flex;gap:8px;margin-bottom:10px}
.meta-tag{font-size:0.7rem;padding:1px 6px;border-radius:3px;background:rgba(100,116,139,.2);color:var(--muted)}
.match-desc{font-size:0.85rem;color:var(--muted);line-height:1.6;margin-bottom:12px}
.match-solution{padding:12px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:8px;margin-bottom:12px}
.match-solution h4{font-size:0.8rem;color:var(--green);margin-bottom:6px}
.match-solution p{font-size:0.83rem;line-height:1.5}
.cmds{margin-bottom:8px}
.cmds h4{font-size:0.8rem;color:var(--blue);margin-bottom:6px}
.cmd{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cmd code{flex:1;background:var(--bg);padding:6px 10px;border-radius:4px;font-size:0.8rem;color:var(--cyan);border:1px solid var(--border)}
.copy-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:0.7rem;font-family:inherit}
.copy-btn:hover{color:var(--text);border-color:var(--muted)}
.match-patterns{margin-top:10px;font-size:0.75rem;color:var(--muted)}
.match-patterns code{color:var(--purple)}
.suggestions{margin-top:16px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.suggestions h4{font-size:0.85rem;margin-bottom:8px;color:var(--yellow)}
.suggestions li{font-size:0.82rem;color:var(--muted);margin-left:16px;margin-bottom:4px}
.docs-link{font-size:0.8rem;color:var(--blue);text-decoration:none}
.docs-link:hover{text-decoration:underline}
.example-errors{margin-top:12px;font-size:0.8rem}
.example-errors span{color:var(--muted);margin-right:6px}
.example-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:3px 8px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:0.75rem;margin:2px}
.example-btn:hover{border-color:var(--blue);color:var(--blue)}
#loading{text-align:center;padding:30px;color:var(--muted)}
</style>
</head>
<body>
<h1>🧠 Nix Doctor</h1>
<p class="subtitle">Paste any NixOS error message to get an AI-powered diagnosis</p>

<div class="kb-stats">
  <span>📚 Knowledge Base: <strong id="kbCount">-</strong> entries</span>
  <span>🏷️ Categories: evaluation, build, packages, system, services, configuration</span>
</div>

<div class="input-area">
  <textarea id="errorInput" placeholder="Paste your NixOS error message here...&#10;&#10;Examples:&#10;  error: attribute 'nginx' missing&#10;  collision between 'openssl-3.0.0' and 'openssl-1.1.1'&#10;  No space left on device&#10;  infinite recursion encountered"></textarea>
  <div class="example-errors">
    <span>Try:</span>
    <button class="example-btn" onclick="loadExample(0)">Missing attribute</button>
    <button class="example-btn" onclick="loadExample(1)">Package collision</button>
    <button class="example-btn" onclick="loadExample(2)">Disk full</button>
    <button class="example-btn" onclick="loadExample(3)">Service failed</button>
    <button class="example-btn" onclick="loadExample(4)">Hash mismatch</button>
    <button class="example-btn" onclick="loadExample(5)">Infinite recursion</button>
  </div>
  <div class="input-row">
    <input type="text" class="context-input" id="contextInput" placeholder="Optional: additional context (service name, file path, etc.)">
    <button class="btn" onclick="diagnose()" id="diagnoseBtn">🔍 Diagnose</button>
    <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
  </div>
</div>

<div id="loading" style="display:none">🧠 Analyzing error message...</div>

<div class="results" id="results">
  <div id="matchResults"></div>
</div>

<script>
const apiBase = location.origin;

const examples = [
  "error: The option `services.nginx.hostName' is used but not defined.\n\nIn /etc/nixos/configuration.nix:12:5",
  "collision between `/nix/store/abc-openssl-3.0.0/bin/openssl' and `/nix/store/def-openssl-1.1.1/bin/openssl'\npackages have the same priority",
  "error: writing to file '/nix/store/.links/012345': No space left on device\n\nwhile setting up the build environment",
  "nginx.service: Main process exited, code=exited, status=1/FAILURE\nUnit nginx.service entered failed state.",
  "hash mismatch in fixed-output derivation '/nix/store/abc-source.tar.gz':\n  expected: sha256-AAAAAA...\n  got:      sha256-BBBBBB...",
  "error: infinite recursion encountered\n\nat /nix/store/abc-module.nix:42:10"
];

function loadExample(i) {
  document.getElementById('errorInput').value = examples[i];
}

function clearAll() {
  document.getElementById('errorInput').value = '';
  document.getElementById('contextInput').value = '';
  document.getElementById('results').style.display = 'none';
}

async function diagnose() {
  const errorMsg = document.getElementById('errorInput').value.trim();
  if (!errorMsg) return;

  document.getElementById('loading').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  document.getElementById('diagnoseBtn').disabled = true;

  try {
    const body = { error_message: errorMsg };
    const ctx = document.getElementById('contextInput').value.trim();
    if (ctx) body.context = ctx;

    const res = await fetch(apiBase + '/api/doctor/diagnose', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!res.ok) throw new Error('API error: ' + res.status);
    const data = await res.json();
    renderResults(data);
  } catch (e) {
    document.getElementById('matchResults').innerHTML =
      '<div class="no-match"><div class="big-emoji">⚠️</div><p>Error: ' + e.message + '</p></div>';
    document.getElementById('results').style.display = 'block';
  } finally {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('diagnoseBtn').disabled = false;
  }
}

function renderResults(data) {
  document.getElementById('kbCount').textContent = data.total_kb_entries;
  const container = document.getElementById('matchResults');

  if (!data.matches || data.matches.length === 0) {
    let html = '<div class="no-match"><div class="big-emoji">🤷</div>';
    html += '<p>No known diagnosis found for this error.</p></div>';
    if (data.suggestions && data.suggestions.length) {
      html += '<div class="suggestions"><h4>💡 Suggestions</h4><ul>';
      data.suggestions.forEach(s => html += '<li>' + escapeHtml(s) + '</li>');
      html += '</ul></div>';
    }
    container.innerHTML = html;
    document.getElementById('results').style.display = 'block';
    return;
  }

  let html = '<div class="matches">';
  data.matches.forEach(m => {
    const confPct = Math.round(m.confidence * 100);
    html += '<div class="match ' + m.severity + '">';
    html += '<div class="match-header">';
    html += '<span class="match-title">' + escapeHtml(m.title) + '</span>';
    html += '<div><span class="severity-badge ' + m.severity + '">' + m.severity + '</span>';
    html += '<span class="confidence">' + confPct + '% match</span></div>';
    html += '</div>';

    html += '<div class="match-meta">';
    html += '<span class="meta-tag">' + escapeHtml(m.category) + '</span>';
    html += '</div>';

    html += '<div class="match-desc">' + escapeHtml(m.description) + '</div>';

    html += '<div class="match-solution"><h4>✅ Solution</h4><p>' + escapeHtml(m.solution) + '</p></div>';

    if (m.commands && m.commands.length) {
      html += '<div class="cmds"><h4>🔧 Commands</h4>';
      m.commands.forEach(c => {
        html += '<div class="cmd"><code>' + escapeHtml(c) + '</code>';
        html += '<button class="copy-btn" onclick="copyCmd(this, \'' + escapeHtml(c).replace(/'/g, "\\'") + '\')">Copy</button></div>';
      });
      html += '</div>';
    }

    if (m.docs_url) {
      html += '<a class="docs-link" href="' + escapeHtml(m.docs_url) + '" target="_blank">📖 Documentation →</a>';
    }

    if (m.matched_patterns && m.matched_patterns.length) {
      html += '<div class="match-patterns">Matched: ';
      m.matched_patterns.forEach(p => html += '<code>' + escapeHtml(p) + '</code> ');
      html += '</div>';
    }

    html += '</div>';
  });
  html += '</div>';

  if (data.suggestions && data.suggestions.length) {
    html += '<div class="suggestions"><h4>💡 Additional Suggestions</h4><ul>';
    data.suggestions.forEach(s => html += '<li>' + escapeHtml(s) + '</li>');
    html += '</ul></div>';
  }

  container.innerHTML = html;
  document.getElementById('results').style.display = 'block';
}

function copyCmd(btn, cmd) {
  navigator.clipboard.writeText(cmd).then(() => {
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// Load KB count on page load
fetch(apiBase + '/api/doctor/knowledge')
  .then(r => r.json())
  .then(d => { document.getElementById('kbCount').textContent = d.total; })
  .catch(() => {});
</script>
</body>
</html>
