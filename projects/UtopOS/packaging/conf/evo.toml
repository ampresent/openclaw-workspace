# ═══════════════════════════════════════════════════
# evo.toml — UtopOS 统一配置
# 位置: /etc/utopos/evo.toml (系统级)
#       ~/.config/utopos/evo.toml (用户级，覆盖系统级)
#
# 环境变量: 所有配置项均可通过 EVO_<SECTION>_<KEY> 覆盖
# 示例: EVO_SERVER_BIND=0.0.0.0:8080 覆盖 server.bind
# ═══════════════════════════════════════════════════

# ──────────────────────────────────────────────────
# [core] — 全局基础配置
# ──────────────────────────────────────────────────
[core]
# 数据根目录
data_dir = "/var/lib/utopos"
# 日志级别: trace / debug / info / warn / error
log_level = "info"
# 日志目录
log_dir = "/var/log/utopos"
# 历史记录保留天数 (0 = 永不清理)
history_retention_days = 90
# 工作语言 (影响输出和报告)
locale = "zh-CN"
# 时区 (用于日志和报告时间戳)
timezone = "Asia/Shanghai"
# 是否启用彩色输出
color = true
# 默认 dry-run 模式 (true = 所有操作默认预览)
default_dry_run = false

# ──────────────────────────────────────────────────
# [server] — API 服务 (evo serve)
# 管理: advisor, dashboard, metrics, stream, api_version
# ──────────────────────────────────────────────────
[server]
bind = "127.0.0.1:7890"
# 外部访问: "0.0.0.0:7890" 或 "unix:/var/run/utopos.sock"
workers = 4
# 请求超时 (秒)
request_timeout = 300
# CORS 配置
cors_origins = ["http://localhost:3000"]
# 启用请求追踪
tracing = true

# ──────────────────────────────────────────────────
# [auth] — 认证
# 管理: auth, tls, security
# ──────────────────────────────────────────────────
[auth]
# 认证模式: token / none / tls-mutual
mode = "token"
# API token (留空则自动生成)
token = ""
# TLS (mode=tls-mutual 时生效)
[tls]
enabled = false
cert_file = ""
key_file = ""
ca_file = ""

# ──────────────────────────────────────────────────
# [backend] — 包管理器后端
# 管理: detect, install, deps, deps-batch
# ──────────────────────────────────────────────────
[backend]
# 默认后端: auto / rpm / conda / btrfs / nix
default = "auto"
# 自动检测优先级 (从左到右)
detect_priority = ["btrfs", "rpm", "conda", "nix"]
# 安装时自动快照
auto_snapshot = true
# 安装时自动备份文件副本 (用于 Layer2 回滚)
auto_backup = true
# 安装前自动检测依赖冲突
check_deps_before_install = true

# RPM 后端
[backend.rpm]
# 包管理器命令
manager = "yum"          # yum / dnf
# SRPM 搜索路径
srpm_search_paths = ["/root/rpmbuild/SRPMS", "/var/cache/utopos/srpms"]
# 构建选项
build_macros = { "_topdir" = "/root/rpmbuild" }
# 自动验证 GPG 签名
verify_signature = true

# Conda 后端
[backend.conda]
# conda 可执行路径
executable = "conda"
# 默认环境
default_env = "base"
# solver: classic / libmamba / rattler
solver = "libmamba"
# 通道优先级
channels = ["conda-forge", "defaults"]
# 自动清理缓存
auto_clean = true

# btrfs 后端
[backend.btrfs]
# btrfs 挂载点
mount_point = "/"
# 快照存储目录
snapshot_dir = "/var/lib/utopos/btrfs-snapshots"
# 保留的 pre-install 快照数量
max_pre_snapshots = 10
# 保留的 rollback-from 快照数量
max_rollback_snapshots = 5
# 快照压缩 (zstd)
snapshot_compression = true

# Nix 后端 (参考，UtopOS 不封装 nix 回滚)
[backend.nix]
profile_dir = "/nix/var/nix/profiles"
# 使用 nixos-rebuild 还是 nix profile
mode = "nixos-rebuild"

# ──────────────────────────────────────────────────
# [rollback] — 回滚系统
# 管理: rollback, revert
# ──────────────────────────────────────────────────
[rollback]
# 自动检测后端优先级
auto_detect = true
# 回滚前创建保险快照
safety_snapshot = true
# 回滚后自动验证 (health check)
auto_verify = true
# dry-run 输出格式: json / text / table
plan_format = "json"

# ──────────────────────────────────────────────────
# [monitor] — 文件系统监控
# 管理: snapshot, diff, fence, monitor
# ──────────────────────────────────────────────────
[monitor]
# 快照存储目录
snapshot_dir = "/var/lib/utopos/snapshots"
# 快照格式: manifest (JSONL) / tar
format = "manifest"
# 哈希算法: sha256 / blake3
hash_algorithm = "sha256"
# 排除模式 (glob)
exclude_patterns = [
    "*.pyc", "__pycache__", ".git", "node_modules",
    "*.tmp", "*.swp", ".DS_Store", "target/debug"
]
# 监控超时 (秒, 0 = 无限制)
fence_timeout = 300
# 实时监控的 inotify 事件掩码
inotify_events = ["create", "modify", "delete", "move"]

# ──────────────────────────────────────────────────
# [backup] — 文件备份
# 管理: backup
# ──────────────────────────────────────────────────
[backup]
# 备份存储目录
backup_dir = "/var/lib/utopos/backups"
# 备份工具: rsync / cp / tar
tool = "rsync"
# 备份时保留文件属性
preserve_attrs = true
# 最大备份目录大小 (MB, 0 = 不限制)
max_size_mb = 5120
# 自动清理过期备份
auto_cleanup = true

# ──────────────────────────────────────────────────
# [patch] — 补丁管理
# 管理: patch-create, patch-check, patch-list, patch-series
# ──────────────────────────────────────────────────
[patch]
# 补丁存储目录
patch_dir = "/var/lib/utopos/patches"
# 补丁格式: unified / git
format = "unified"
# 自动检查补丁质量
auto_check = true
# 补丁系列命名模板
series_template = "{pkg}-{version}-{seq:03d}"
# 补丁风险评估: enabled / disabled
risk_assessment = "enabled"

# ──────────────────────────────────────────────────
# [upstream] — 上游追踪
# 管理: upstream-add, upstream-check, upstream-fetch, upstream-prompt
# ──────────────────────────────────────────────────
[upstream]
# 上游源列表配置目录
sources_dir = "/var/lib/utopos/upstream"
# 自动检查间隔 (小时, 0 = 仅手动)
auto_check_interval = 24
# 自动 fetch 新版本
auto_fetch = false
# 差异分析: patch / file / semantic
diff_mode = "patch"
# 通知: none / log / webhook
notify_on_update = "log"
# webhook URL (notify_on_update=webhook 时)
webhook_url = ""

# ──────────────────────────────────────────────────
# [build] — 构建系统
# 管理: build, build-queue, build-cache
# ──────────────────────────────────────────────────
[build]
# 构建缓存目录
cache_dir = "/var/lib/utopos/build-cache"
# 最大并行构建数
max_parallel = 2
# 构建超时 (秒)
timeout = 3600
# 自动清理旧构建产物
auto_clean = true
# 保留最近 N 个构建
keep_recent = 5
# 构建验证 (安装后自动运行 test)
verify_after_build = true

# ──────────────────────────────────────────────────
# [verify] — 构建验证
# 管理: verify, test
# ──────────────────────────────────────────────────
[verify]
# 验证模式: strict / permissive / custom
mode = "permissive"
# 自动测试命令 (留空跳过)
test_command = ""
# 风险等级阈值 (超过则需要人工确认)
risk_threshold = "moderate"  # low / moderate / high / critical
# 验证项
check_binary = true          # 检查二进制文件完整性
check_config_compat = true   # 检查配置文件兼容性
check_service_restart = true # 检查服务重启影响

# ──────────────────────────────────────────────────
# [inventor] — 系统清单
# 管理: inventory, get-info, log, log-query
# ──────────────────────────────────────────────────
[inventory]
# 清单存储目录
inventory_dir = "/var/lib/utopos/inventory"
# 自动扫描间隔 (小时)
auto_scan_interval = 6
# 记录的包信息级别: minimal / standard / full
detail_level = "standard"
# 历史日志格式: jsonl / csv
log_format = "jsonl"

# ──────────────────────────────────────────────────
# [deploy] — 部署管理
# 管理: deploy-status, sync, workspace
# ──────────────────────────────────────────────────
[deploy]
# 部署状态文件
status_file = "/var/lib/utopos/deploy-status.json"
# 同步目标 (多机部署用)
sync_targets = []
# 同步模式: push / pull / bidirectional
sync_mode = "push"
# 同步前自动快照
snapshot_before_sync = true

# ──────────────────────────────────────────────────
# [cleanup] — 清理策略
# 管理: cleanup
# ──────────────────────────────────────────────────
[cleanup]
# 自动清理
enabled = true
# 清理间隔 (小时)
interval = 168   # 每周
# 清理目标
[cleanup.targets]
snapshots = true
backups = true
build_cache = true
logs = true
patches = false    # 补丁默认不自动清理
# 保留策略
[cleanup.retention]
snapshots_days = 30
backups_days = 14
logs_days = 60
build_cache_days = 7

# ──────────────────────────────────────────────────
# [rebase] — 变基管理
# 管理: rebase
# ──────────────────────────────────────────────────
[rebase]
# 自动 rebase 策略: manual / auto-on-conflict / auto-always
strategy = "manual"
# 冲突解决: interactive / ours / theirs / abort
conflict_resolution = "interactive"
# rebase 前创建保险快照
snapshot_before_rebase = true

# ──────────────────────────────────────────────────
# [doctor] — 健康诊断
# 管理: doctor, health-score, healer
# ──────────────────────────────────────────────────
[doctor]
# 定期诊断 (小时, 0 = 仅手动)
auto_diagnose_interval = 24
# 健康评分阈值 (低于此值触发告警)
health_threshold = 60
# 自动修复: none / safe / aggressive
auto_heal = "safe"
# 诊断项
[doctor.checks]
disk_space = true           # 磁盘空间
package_integrity = true    # 包完整性
service_status = true       # 服务状态
config_drift = true         # 配置漂移
permission_check = true     # 权限检查
orphan_packages = false     # 孤立包检测

# ──────────────────────────────────────────────────
# [advisor] — AI 建议引擎
# 管理: advisor, predict, ai_config, composer, marketplace
# ──────────────────────────────────────────────────
[advisor]
# 启用 AI 建议
enabled = true
# 预测模式: rollback-target / update-risk / both
predict_mode = "both"
# 市场插件源
marketplace_url = "https://utopos.dev/plugins"
# 自动推荐阈值 (置信度 0-1)
recommendation_threshold = 0.7

# ──────────────────────────────────────────────────
# [docker] — Docker 集成
# 管理: docker
# ──────────────────────────────────────────────────
[docker]
enabled = false
# Docker socket
socket = "/var/run/docker.sock"
# 容器内 UtopOS 代理
agent_image = "utopos/agent:latest"
# 自动监控容器变更
monitor_containers = true

# ──────────────────────────────────────────────────
# [cicd] — CI/CD 集成
# 管理: cicd, gitops
# ──────────────────────────────────────────────────
[cicd]
enabled = false
# GitOps 仓库
git_repo = ""
# 自动构建触发: on-push / on-tag / manual
trigger = "manual"
# 构建状态通知
notify_channel = ""   # slack / discord / webhook

# ──────────────────────────────────────────────────
# [security] — 安全策略
# 管理: security, pkg_risk, limiter
# ──────────────────────────────────────────────────
[security]
# 包风险评估
pkg_risk_enabled = true
# 安装限制 (禁止安装的包模式)
deny_patterns = []
# 速率限制
[security.rate_limit]
enabled = true
# 每分钟最大操作数
max_ops_per_minute = 10
# 每小时最大安装数
max_installs_per_hour = 20

# ──────────────────────────────────────────────────
# [i18n] — 国际化
# 管理: i18n
# ──────────────────────────────────────────────────
[i18n]
# 界面语言
language = "zh-CN"
# 报告语言 (可与界面不同)
report_language = "zh-CN"
# 翻译目录
translation_dir = "/usr/share/utopos/locales"

# ──────────────────────────────────────────────────
# [compat] — 兼容性
# 管理: compat, hybrid, flake
# ──────────────────────────────────────────────────
[compat]
# 跨后端兼容性检查
cross_backend_check = true
# 混合模式 (多后端共存)
hybrid_mode = false
# Nix flake 兼容 (当使用非 nix 后端时)
flake_compat = false

# ──────────────────────────────────────────────────
# [plugin] — 插件系统
# 管理: plugin
# ──────────────────────────────────────────────────
[plugin]
# 插件目录
plugin_dir = "/var/lib/utopos/plugins"
# 允许的插件列表 (空 = 允许所有)
allowed_plugins = []
# 插件沙箱: none / chroot / container
sandbox = "none"

# ──────────────────────────────────────────────────
# [env] — 环境管理
# 管理: env_branch, env_fingerprint, env_migrate, env_remote,
#        env_repair, env_sync, env_templates, env_test
# ──────────────────────────────────────────────────
[env]
# 环境模板目录
template_dir = "/usr/share/utopos/templates"
# 环境指纹记录
fingerprint_enabled = true
# 远程环境同步
remote_sync = false
# 远程地址
remote_url = ""
# 环境测试: after-sync / after-migrate / always
auto_test = "after-migrate"

# ──────────────────────────────────────────────────
# [dashboard] — 可观测性面板
# 管理: dashboard, metrics, observability, tracing_middleware
# ──────────────────────────────────────────────────
[dashboard]
enabled = true
# 指标暴露端口
metrics_port = 9090
# 指标格式: prometheus / json
metrics_format = "prometheus"
# 分布式追踪
tracing = false
# 追踪采样率 (0.0 - 1.0)
trace_sample_rate = 0.1

# ──────────────────────────────────────────────────
# [stream] — 实时事件流
# 管理: stream
# ──────────────────────────────────────────────────
[stream]
enabled = true
# 最大连接数
max_connections = 50
# 事件缓冲大小
buffer_size = 1000
# 事件类型过滤
filter = ["install", "rollback", "snapshot", "error"]
