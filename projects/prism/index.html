<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Prism 棱镜</title>
  <meta name="description" content="Prism — 你的身体表达与气质塑造伙伴">
  <meta name="theme-color" content="#0c0c14">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="loading-screen" id="loading-screen">
  <div class="loading-prism"></div>
  <div class="loading-text">PRISM</div>
</div>

<div id="app" class="hidden">

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="sidebar-logo">◇</div>
    <div class="sidebar-item active" data-page="today"><span>📋</span><span class="tooltip">今日</span></div>
    <div class="sidebar-item" data-page="voice"><span>🎤</span><span class="tooltip">声音训练</span></div>
    <div class="sidebar-item" data-page="skin"><span>🧴</span><span class="tooltip">护肤</span></div>
    <div class="sidebar-item" data-page="exercise"><span>💪</span><span class="tooltip">锻炼</span></div>
    <div class="sidebar-item" data-page="community"><span>🌻</span><span class="tooltip">社群</span></div>
    <div class="sidebar-spacer"></div>
    <div class="sidebar-bottom">
      <div class="sidebar-item" id="btn-export"><span>📦</span><span class="tooltip">导出数据</span></div>
    </div>
  </nav>

  <!-- Main -->
  <div class="main">
    <header class="main-header">
      <h1 id="page-title">今日</h1>
      <div class="streak-badge">🔥 <span id="streak-number">0</span> 天</div>
    </header>

    <!-- TODAY -->
    <div class="page active" id="page-today">
      <div class="page-today">
        <div class="greeting-section">
          <div class="greeting-time" id="greeting-time">早安 ☀️</div>
          <div class="greeting-sub" id="greeting-sub"></div>
          <div class="greeting-affirmation" id="daily-affirmation"></div>
        </div>

        <div class="today-section">// 晨间</div>
        <div id="plan-morning" class="plan-card"></div>

        <div class="today-section" id="section-training">// 训练</div>
        <div id="plan-training" class="plan-card"></div>

        <div class="today-section">// 护肤</div>
        <div id="plan-skin" class="plan-card"></div>

        <div class="today-section">// 穿搭</div>
        <div id="plan-outfit" class="plan-card"></div>

        <div class="today-section" id="section-evening">// 晚间</div>
        <div id="plan-evening" class="plan-card"></div>
      </div>
    </div>

    <!-- VOICE -->
    <div class="page" id="page-voice">
      <div class="sub-page">
        <div class="card">
          <div class="card-title">🎤 声音训练</div>
          <div class="pitch-monitor">
            <div class="pitch-value" id="pitch-value-page">-- Hz</div>
            <div class="pitch-label">实时音高监测</div>
            <div class="pitch-indicator"></div>
          </div>
          <div style="display:flex;gap:8px;margin-top:14px;justify-content:center">
            <button class="btn btn-primary" onclick="App.startPitch()">🎤 开始监测</button>
          </div>
        </div>
        <div class="card">
          <div class="card-title">练习句子</div>
          <div id="voice-sentences"></div>
        </div>
      </div>
    </div>

    <!-- SKIN -->
    <div class="page" id="page-skin">
      <div class="sub-page">
        <div class="card">
          <div class="card-title" id="skin-page-title">🧴 护肤流程</div>
          <div id="skin-page-routine"></div>
        </div>
      </div>
    </div>

    <!-- EXERCISE -->
    <div class="page" id="page-exercise">
      <div class="sub-page">
        <div id="workout-plan-full"></div>
      </div>
    </div>

    <!-- COMMUNITY -->
    <div class="page" id="page-community">
      <div class="sub-page">
        <div class="tags-row" style="margin-bottom:16px">
          <span class="tag active" onclick="UI.renderCommunityPage('all');document.querySelectorAll('.page-community .tag').forEach(t=>t.classList.remove('active'));this.classList.add('active')">全部</span>
          <span class="tag" onclick="UI.renderCommunityPage('voice');document.querySelectorAll('.page-community .tag').forEach(t=>t.classList.remove('active'));this.classList.add('active')">声音</span>
          <span class="tag" onclick="UI.renderCommunityPage('makeup');document.querySelectorAll('.page-community .tag').forEach(t=>t.classList.remove('active'));this.classList.add('active')">化妆</span>
          <span class="tag" onclick="UI.renderCommunityPage('fashion');document.querySelectorAll('.page-community .tag').forEach(t=>t.classList.remove('active'));this.classList.add('active')">穿搭</span>
          <span class="tag" onclick="UI.renderCommunityPage('exercise');document.querySelectorAll('.page-community .tag').forEach(t=>t.classList.remove('active'));this.classList.add('active')">锻炼</span>
        </div>
        <div id="stories-feed"></div>
      </div>
    </div>

  </div>
</div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
