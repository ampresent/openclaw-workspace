<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conda Environment Matrix — nix-evo</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --yellow: #d29922; --orange: #db6d28;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 2rem; }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  .subtitle { color: var(--muted); margin-bottom: 2rem; font-size: 0.9rem; }
  .controls { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; align-items: center; }
  .controls input { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.9rem; width: 200px; }
  .controls button { background: var(--accent); color: #000; border: none; padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
  .controls button:hover { opacity: 0.9; }
  .controls button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .tag { display: inline-block; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.2rem 0.6rem; font-size: 0.8rem; margin: 0.2rem; cursor: pointer; }
  .tag.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tag .remove { margin-left: 0.3rem; color: var(--red); cursor: pointer; }
  .env-list { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .score-card { display: flex; gap: 1.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
  .score-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.5rem; min-width: 180px; }
  .score-item .label { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .score-item .value { font-size: 2rem; font-weight: 700; margin-top: 0.3rem; }
  .score-item .value.high { color: var(--green); }
  .score-item .value.medium { color: var(--yellow); }
  .score-item .value.low { color: var(--red); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; margin-bottom: 2rem; }
  th, td { padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); text-align: left; font-size: 0.85rem; }
  th { background: #1c2128; color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; position: sticky; top: 0; }
  tr:hover { background: #1c2128; }
  .diff { color: var(--red); font-weight: 600; }
  .match { color: var(--green); }
  .missing { color: var(--muted); font-style: italic; }
  .section { margin-bottom: 2rem; }
  .section h2 { font-size: 1.1rem; margin-bottom: 1rem; color: var(--accent); }
  .pairwise { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1rem; }
  .pair-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
  .pair-card h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
  .pair-score { font-size: 1.5rem; font-weight: 700; }
  .pair-stats { display: flex; gap: 1rem; margin-top: 0.5rem; font-size: 0.8rem; color: var(--muted); }
  .loading { color: var(--muted); text-align: center; padding: 3rem; }
  .error { background: rgba(248,81,73,0.1); border: 1px solid var(--red); border-radius: 8px; padding: 1rem; color: var(--red); margin-bottom: 1rem; }
  .filter-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .filter-row select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.8rem; border-radius: 6px; }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
  .badge-diff { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge-match { background: rgba(63,185,80,0.15); color: var(--green); }
</style>
</head>
<body>
<h1>📊 Conda Environment Comparison Matrix</h1>
<p class="subtitle">Compare environments side by side — version diffs, compatibility scores, missing packages</p>

<div class="controls">
  <input type="text" id="envInput" placeholder="Environment name (e.g. base)">
  <button onclick="addEnv()">+ Add</button>
  <button class="secondary" onclick="clearAll()">Clear All</button>
  <button onclick="runComparison()" id="runBtn">Run Comparison</button>
</div>

<div class="env-list" id="envList"></div>

<div id="error" class="error" style="display:none"></div>

<div id="results" style="display:none">
  <div class="score-card" id="scoreCards"></div>

  <div class="section">
    <h2>🔍 Package Matrix</h2>
    <div class="filter-row">
      <select id="filterMode" onchange="renderMatrix()">
        <option value="all">All packages</option>
        <option value="diff">Only differences</option>
        <option value="missing">With missing</option>
      </select>
    </div>
    <div style="overflow-x:auto">
      <table id="matrixTable">
        <thead id="matrixHead"></thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <h2>🔗 Pairwise Compatibility</h2>
    <div class="pairwise" id="pairwiseCards"></div>
  </div>

  <div class="section">
    <h2>🏷️ Unique Packages</h2>
    <div id="uniquePackages"></div>
  </div>
</div>

<script>
let envs = [];
let report = null;

function addEnv() {
  const input = document.getElementById('envInput');
  const name = input.value.trim();
  if (name && !envs.includes(name)) {
    envs.push(name);
    input.value = '';
    renderEnvList();
  }
}

function removeEnv(name) {
  envs = envs.filter(e => e !== name);
  renderEnvList();
}

function clearAll() {
  envs = [];
  report = null;
  renderEnvList();
  document.getElementById('results').style.display = 'none';
  document.getElementById('error').style.display = 'none';
}

function renderEnvList() {
  const el = document.getElementById('envList');
  el.innerHTML = envs.map(e =>
    `<span class="tag active">${e}<span class="remove" onclick="removeEnv('${e}')">×</span></span>`
  ).join('');
}

async function runComparison() {
  if (envs.length < 2) {
    showError('Add at least 2 environments to compare');
    return;
  }
  const btn = document.getElementById('runBtn');
  btn.textContent = 'Running...';
  btn.disabled = true;
  document.getElementById('error').style.display = 'none';

  try {
    const res = await fetch('/api/conda/compare', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ envs })
    });
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err);
    }
    report = await res.json();
    renderResults();
  } catch (e) {
    showError(e.message);
  } finally {
    btn.textContent = 'Run Comparison';
    btn.disabled = false;
  }
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
}

function renderResults() {
  document.getElementById('results').style.display = 'block';

  // Score cards
  const cards = document.getElementById('scoreCards');
  const scoreClass = report.overall_compatibility >= 80 ? 'high' :
                     report.overall_compatibility >= 50 ? 'medium' : 'low';
  cards.innerHTML = `
    <div class="score-item">
      <div class="label">Overall Compatibility</div>
      <div class="value ${scoreClass}">${report.overall_compatibility}%</div>
    </div>
    <div class="score-item">
      <div class="label">Environments</div>
      <div class="value">${report.environments.length}</div>
    </div>
    <div class="score-item">
      <div class="label">Universal Packages</div>
      <div class="value">${report.universal_packages.length}</div>
    </div>
    <div class="score-item">
      <div class="label">Total Packages</div>
      <div class="value">${report.package_matrix.length}</div>
    </div>
  `;

  renderMatrix();
  renderPairwise();
  renderUnique();
}

function renderMatrix() {
  const filter = document.getElementById('filterMode').value;
  let matrix = report.package_matrix;

  if (filter === 'diff') matrix = matrix.filter(p => p.has_difference);
  if (filter === 'missing') matrix = matrix.filter(p => Object.values(p.versions).includes('—'));

  const head = document.getElementById('matrixHead');
  head.innerHTML = `<tr><th>Package</th>${report.environments.map(e => `<th>${e.name}</th>`).join('')}<th>Status</th></tr>`;

  const body = document.getElementById('matrixBody');
  body.innerHTML = matrix.map(row => {
    const vals = report.environments.map(e => {
      const v = row.versions[e.name] || '—';
      return v === '—' ? `<td class="missing">—</td>` :
             row.has_difference ? `<td class="diff">${v}</td>` : `<td class="match">${v}</td>`;
    }).join('');
    const badge = row.has_difference ? '<span class="badge badge-diff">DIFF</span>' :
                  Object.values(row.versions).includes('—') ? '<span class="badge" style="color:var(--yellow)">PARTIAL</span>' :
                  '<span class="badge badge-match">OK</span>';
    return `<tr><td><strong>${row.package}</strong></td>${vals}<td>${badge}</td></tr>`;
  }).join('');
}

function renderPairwise() {
  const el = document.getElementById('pairwiseCards');
  el.innerHTML = report.pairwise.map(p => {
    const sc = p.compatibility_score;
    const scClass = sc >= 80 ? 'high' : sc >= 50 ? 'medium' : 'low';
    return `<div class="pair-card">
      <h3>${p.env_a} ↔ ${p.env_b}</h3>
      <div class="pair-score ${scClass}">${sc}%</div>
      <div class="pair-stats">
        <span>Shared: ${p.shared_packages}</span>
        <span>Only in ${p.env_a}: ${p.only_in_a}</span>
        <span>Only in ${p.env_b}: ${p.only_in_b}</span>
        <span>Mismatches: ${p.version_mismatches}</span>
      </div>
    </div>`;
  }).join('');
}

function renderUnique() {
  const el = document.getElementById('uniquePackages');
  const entries = Object.entries(report.unique_packages_per_env);
  el.innerHTML = entries.map(([env, pkgs]) => {
    if (pkgs.length === 0) return `<div class="pair-card"><h3>${env}</h3><p style="color:var(--muted)">No unique packages</p></div>`;
    return `<div class="pair-card"><h3>${env} (${pkgs.length} unique)</h3>
      <div style="max-height:200px;overflow-y:auto;font-size:0.85rem;color:var(--muted)">${pkgs.join(', ')}</div>
    </div>`;
  }).join('');
}

document.getElementById('envInput').addEventListener('keypress', e => { if (e.key === 'Enter') addEnv(); });
</script>
</body>
</html>
