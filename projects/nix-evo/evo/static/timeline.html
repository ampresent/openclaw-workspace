<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nix-evo · Generation Timeline</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'SF Mono', 'Fira Code', monospace; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
header { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 20px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 50; }
header h1 { font-size: 16px; color: #58a6ff; }
.header-controls { margin-left: auto; display: flex; gap: 8px; }
.header-controls button {
  background: #238636; border: 1px solid #238636; color: #fff; padding: 6px 14px;
  border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit;
}
.header-controls button.secondary { background: #21262d; border-color: #30363d; color: #c9d1d9; }
.header-controls button:hover { opacity: 0.85; }
.container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
.timeline { position: relative; padding-left: 40px; }
.timeline::before {
  content: ''; position: absolute; left: 18px; top: 0; bottom: 0;
  width: 2px; background: #30363d;
}
.gen-card {
  position: relative; background: #161b22; border: 1px solid #30363d; border-radius: 10px;
  padding: 16px 18px; margin-bottom: 16px; transition: all 0.2s;
  cursor: pointer;
}
.gen-card:hover { border-color: #58a6ff; transform: translateX(4px); }
.gen-card.current { border-color: #4CAF50; background: #0d1f0d; }
.gen-card.selected { border-color: #f0883e; background: #1a1308; }
.gen-dot {
  position: absolute; left: -32px; top: 20px; width: 14px; height: 14px;
  border-radius: 50%; border: 2px solid #30363d; background: #21262d;
}
.gen-card.current .gen-dot { background: #4CAF50; border-color: #4CAF50; box-shadow: 0 0 8px #4CAF5066; }
.gen-card.selected .gen-dot { background: #f0883e; border-color: #f0883e; }
.gen-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.gen-number { font-size: 18px; font-weight: bold; color: #58a6ff; }
.gen-date { color: #8b949e; font-size: 12px; }
.gen-current-badge {
  background: #238636; color: #fff; font-size: 10px; padding: 2px 8px;
  border-radius: 10px; font-weight: bold;
}
.gen-risk { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
.risk-low { background: #23863622; color: #4CAF50; }
.risk-medium { background: #d2992222; color: #d29922; }
.risk-high { background: #f8514922; color: #f85149; }
.gen-desc { color: #c9d1d9; font-size: 13px; margin-top: 6px; }
.gen-meta { display: flex; gap: 16px; margin-top: 8px; font-size: 11px; color: #8b949e; }
.compare-panel {
  position: fixed; bottom: 0; left: 0; right: 0; background: #161b22;
  border-top: 2px solid #f0883e; padding: 14px 20px; display: none;
  align-items: center; gap: 16px; z-index: 100;
}
.compare-panel.visible { display: flex; }
.compare-panel .label { color: #f0883e; font-weight: bold; }
.compare-panel button {
  background: #f0883e; border: none; color: #0d1117; padding: 8px 16px;
  border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 13px;
}
.diff-panel {
  background: #161b22; border: 1px solid #30363d; border-radius: 10px;
  padding: 20px; margin-bottom: 16px;
}
.diff-panel h3 { color: #f0883e; margin-bottom: 12px; }
.diff-panel pre { background: #0d1117; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
.status-bar { color: #8b949e; font-size: 12px; text-align: center; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1>🧬 NixOS Generation Timeline</h1>
  <div class="header-controls">
    <button onclick="loadTimeline()">Refresh</button>
    <button class="secondary" onclick="clearSelection()">Clear Selection</button>
  </div>
</header>
<div class="container" id="main-container">
  <div class="status-bar" id="status">Loading generations...</div>
  <div class="timeline" id="timeline"></div>
</div>
<div class="compare-panel" id="compare-panel">
  <span class="label">⚖️ Compare:</span>
  <span id="compare-info">Select two generations</span>
  <button onclick="runCompare()">Compare</button>
</div>
<script>
let allGenerations = [];
let selectedIds = [];

async function loadTimeline() {
  document.getElementById('status').textContent = 'Loading...';
  try {
    const res = await fetch('/api/timeline?limit=100');
    const data = await res.json();
    allGenerations = data.generations || [];
    renderTimeline();
    document.getElementById('status').textContent = `${data.total} generations loaded`;
  } catch (e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
    // Demo mode
    allGenerations = generateDemoData();
    renderTimeline();
    document.getElementById('status').textContent = `Demo: ${allGenerations.length} generations`;
  }
}

function generateDemoData() {
  const gens = [];
  const services = ['nginx', 'postgresql', 'redis', 'openssh', 'phpfpm', 'prometheus', 'grafana', 'docker'];
  for (let i = 1; i <= 47; i++) {
    const d = new Date(2024, 0, 1 + i * 3);
    const risks = ['low', 'low', 'low', 'medium', 'low', 'high', 'low'];
    gens.push({
      number: i,
      date: d.toISOString().slice(0, 19).replace('T', ' '),
      description: i === 1 ? 'Initial install' :
                   i === 12 ? 'Add nginx + php-fpm stack' :
                   i === 23 ? 'Upgrade to NixOS 24.05' :
                   i === 35 ? 'Add monitoring (prometheus + grafana)' :
                   i === 47 ? 'Current configuration' : `Generation ${i}`,
      nixos_version: i < 23 ? '23.11' : '24.05',
      kernel_version: i < 23 ? '6.1' : '6.6',
      is_current: i === 47,
      risk_level: risks[i % risks.length],
      changes: [],
    });
  }
  return gens;
}

function renderTimeline() {
  const container = document.getElementById('timeline');
  container.innerHTML = allGenerations.map(g => {
    const selected = selectedIds.includes(g.number);
    return `
    <div class="gen-card ${g.is_current ? 'current' : ''} ${selected ? 'selected' : ''}"
         onclick="toggleSelect(${g.number})" data-gen="${g.number}">
      <div class="gen-dot"></div>
      <div class="gen-header">
        <span class="gen-number">#${g.number}</span>
        <span class="gen-date">${g.date}</span>
        ${g.is_current ? '<span class="gen-current-badge">CURRENT</span>' : ''}
        <span class="gen-risk risk-${g.risk_level}">${g.risk_level.toUpperCase()}</span>
      </div>
      ${g.description ? `<div class="gen-desc">${g.description}</div>` : ''}
      <div class="gen-meta">
        ${g.nixos_version ? `<span>NixOS ${g.nixos_version}</span>` : ''}
        ${g.kernel_version ? `<span>Kernel ${g.kernel_version}</span>` : ''}
      </div>
    </div>`;
  }).reverse().join('');
}

function toggleSelect(num) {
  const idx = selectedIds.indexOf(num);
  if (idx >= 0) {
    selectedIds.splice(idx, 1);
  } else {
    if (selectedIds.length >= 2) selectedIds.shift();
    selectedIds.push(num);
  }
  renderTimeline();
  updateComparePanel();
}

function updateComparePanel() {
  const panel = document.getElementById('compare-panel');
  const info = document.getElementById('compare-info');
  if (selectedIds.length === 2) {
    panel.classList.add('visible');
    const [a, b] = selectedIds.sort((x, y) => x - y);
    info.textContent = `#${a} → #${b}`;
  } else if (selectedIds.length === 1) {
    panel.classList.add('visible');
    info.textContent = `Selected #${selectedIds[0]} — click another`;
  } else {
    panel.classList.remove('visible');
  }
}

function clearSelection() {
  selectedIds = [];
  renderTimeline();
  updateComparePanel();
  // Remove diff panels
  document.querySelectorAll('.diff-panel').forEach(e => e.remove());
}

async function runCompare() {
  if (selectedIds.length !== 2) return;
  const [from, to] = selectedIds.sort((a, b) => a - b);

  try {
    const res = await fetch(`/api/timeline/compare?from=${from}&to=${to}`);
    const diff = await res.json();
    showDiff(diff, from, to);
  } catch (e) {
    // Demo diff
    showDiff({
      from, to,
      added_services: ['prometheus', 'grafana'],
      removed_services: [],
      changed_packages: ['nginx: 1.24 → 1.26', 'openssl: 3.0 → 3.1'],
      config_diff_summary: `Generation ${from} → ${to}\n+ Added monitoring stack\n~ Updated nginx and openssl`
    }, from, to);
  }
}

function showDiff(diff, from, to) {
  // Remove existing diff
  document.querySelectorAll('.diff-panel').forEach(e => e.remove());
  const panel = document.createElement('div');
  panel.className = 'diff-panel';
  panel.innerHTML = `
    <h3>⚖️ Compare: Generation #${from} → #${to}</h3>
    ${diff.added_services.length ? `<p style="color:#4CAF50">➕ Added: ${diff.added_services.join(', ')}</p>` : ''}
    ${diff.removed_services.length ? `<p style="color:#f85149">➖ Removed: ${diff.removed_services.join(', ')}</p>` : ''}
    ${diff.changed_packages.length ? `<p style="color:#d29922">📦 Changed: ${diff.changed_packages.join(', ')}</p>` : ''}
    <pre>${diff.config_diff_summary}</pre>
  `;
  document.getElementById('main-container').insertBefore(panel, document.getElementById('timeline'));
}

window.addEventListener('load', loadTimeline);
</script>
</body>
</html>
