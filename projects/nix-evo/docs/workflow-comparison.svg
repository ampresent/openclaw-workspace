<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="'Inter','SF Pro','Helvetica Neue',sans-serif">
  <defs>
    <linearGradient id="gOld" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <linearGradient id="gNew" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="gStepOld" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#991b1b"/><stop offset="100%" stop-color="#7c2d12"/></linearGradient>
    <linearGradient id="gStepNew" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#164e63"/><stop offset="100%" stop-color="#4c1d95"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.15"/></filter>
    <marker id="arrOld" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7z" fill="#f87171"/>
    </marker>
    <marker id="arrNew" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7z" fill="#67e8f9"/>
    </marker>
    <marker id="arrX" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" rx="20" fill="#0f172a"/>

  <!-- Title -->
  <text x="480" y="44" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">OS 研发流程对比</text>
  <text x="480" y="68" text-anchor="middle" fill="#94a3b8" font-size="13">传统方式 vs nix-evo 方式</text>

  <!-- Divider -->
  <line x1="480" y1="88" x2="480" y2="690" stroke="#334155" stroke-width="1" stroke-dasharray="6"/>

  <!-- ===== LEFT: Old Way ===== -->
  <rect x="30" y="90" width="430" height="28" rx="6" fill="url(#gOld)" opacity="0.9"/>
  <text x="245" y="109" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">❌ 传统 OS 研发流程</text>

  <!-- Steps -->
  <!-- Step 1 -->
  <rect x="50" y="132" width="390" height="52" rx="10" fill="#1e293b" stroke="#7f1d1d" stroke-width="1"/>
  <circle cx="76" cy="158" r="14" fill="#7f1d1d"/>
  <text x="76" y="163" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">1</text>
  <text x="100" y="152" fill="#f1f5f9" font-size="13" font-weight="600">SSH 登录服务器</text>
  <text x="100" y="170" fill="#64748b" font-size="11">手动连接，记住 IP、端口、密钥</text>

  <line x1="245" y1="184" x2="245" y2="200" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrOld)"/>

  <!-- Step 2 -->
  <rect x="50" y="204" width="390" height="52" rx="10" fill="#1e293b" stroke="#7f1d1d" stroke-width="1"/>
  <circle cx="76" cy="230" r="14" fill="#7f1d1d"/>
  <text x="76" y="235" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">2</text>
  <text x="100" y="224" fill="#f1f5f9" font-size="13" font-weight="600">翻日志找问题</text>
  <text x="100" y="242" fill="#64748b" font-size="11">journalctl / dmesg / tail -f 猜测</text>

  <line x1="245" y1="256" x2="245" y2="272" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrOld)"/>

  <!-- Step 3 -->
  <rect x="50" y="276" width="390" height="52" rx="10" fill="#1e293b" stroke="#7f1d1d" stroke-width="1"/>
  <circle cx="76" cy="302" r="14" fill="#7f1d1d"/>
  <text x="76" y="307" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">3</text>
  <text x="100" y="296" fill="#f1f5f9" font-size="13" font-weight="600">手动改配置文件</text>
  <text x="100" y="314" fill="#64748b" font-size="11">vim/nano 编辑，语法靠记忆</text>

  <line x1="245" y1="328" x2="245" y2="344" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrOld)"/>

  <!-- Step 4 -->
  <rect x="50" y="348" width="390" height="52" rx="10" fill="#1e293b" stroke="#7f1d1d" stroke-width="1"/>
  <circle cx="76" cy="374" r="14" fill="#7f1d1d"/>
  <text x="76" y="379" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">4</text>
  <text x="100" y="368" fill="#f1f5f9" font-size="13" font-weight="600">交叉手指重启服务</text>
  <text x="100" y="386" fill="#64748b" font-size="11">systemctl restart → 祈祷不炸</text>

  <line x1="245" y1="400" x2="245" y2="416" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrOld)"/>

  <!-- Step 5 -->
  <rect x="50" y="420" width="390" height="52" rx="10" fill="#1e293b" stroke="#7f1d1d" stroke-width="1"/>
  <circle cx="76" cy="446" r="14" fill="#7f1d1d"/>
  <text x="76" y="451" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">5</text>
  <text x="100" y="440" fill="#f1f5f9" font-size="13" font-weight="600">出问题靠记忆回滚</text>
  <text x="100" y="458" fill="#64748b" font-size="11">回退改了什么？上周三那次改的？</text>

  <!-- Pain points -->
  <rect x="50" y="490" width="390" height="90" rx="10" fill="#1e293b" stroke="#450a0a" stroke-width="1"/>
  <text x="245" y="512" text-anchor="middle" fill="#f87171" font-size="12" font-weight="600">⚠️ 痛点</text>
  <text x="68" y="532" fill="#94a3b8" font-size="11">• 人工操作，容易出错</text>
  <text x="68" y="550" fill="#94a3b8" font-size="11">• 变更无预览，直接上线</text>
  <text x="68" y="568" fill="#94a3b8" font-size="11">• 回滚困难，靠 git blame 找人</text>

  <!-- ===== RIGHT: New Way ===== -->
  <rect x="500" y="90" width="430" height="28" rx="6" fill="url(#gNew)" opacity="0.9"/>
  <text x="715" y="109" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">✅ nix-evo 流程</text>

  <!-- Steps -->
  <!-- Step 1 -->
  <rect x="520" y="132" width="390" height="52" rx="10" fill="#1e293b" stroke="#155e75" stroke-width="1"/>
  <circle cx="546" cy="158" r="14" fill="#155e75"/>
  <text x="546" y="163" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">1</text>
  <text x="570" y="152" fill="#f1f5f9" font-size="13" font-weight="600">用自然语言描述问题</text>
  <text x="570" y="170" fill="#67e8f9" font-size="11">"nginx 502 了" → AI 自动诊断</text>

  <line x1="715" y1="184" x2="715" y2="200" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arrNew)"/>

  <!-- Step 2 -->
  <rect x="520" y="204" width="390" height="52" rx="10" fill="#1e293b" stroke="#155e75" stroke-width="1"/>
  <circle cx="546" cy="230" r="14" fill="#155e75"/>
  <text x="546" y="235" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">2</text>
  <text x="570" y="224" fill="#f1f5f9" font-size="13" font-weight="600">AI 自动诊断 + 定位</text>
  <text x="570" y="242" fill="#67e8f9" font-size="11">system_snapshot → service_logs → 定位</text>

  <line x1="715" y1="256" x2="715" y2="272" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arrNew)"/>

  <!-- Step 3 -->
  <rect x="520" y="276" width="390" height="52" rx="10" fill="#1e293b" stroke="#155e75" stroke-width="1"/>
  <circle cx="546" cy="302" r="14" fill="#155e75"/>
  <text x="546" y="307" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">3</text>
  <text x="570" y="296" fill="#f1f5f9" font-size="13" font-weight="600">预览变更 + 风险评估</text>
  <text x="570" y="314" fill="#67e8f9" font-size="11">config_validate → dry-build → 风险分级</text>

  <line x1="715" y1="328" x2="715" y2="344" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arrNew)"/>

  <!-- Step 4 -->
  <rect x="520" y="348" width="390" height="52" rx="10" fill="#1e293b" stroke="#155e75" stroke-width="1"/>
  <circle cx="546" cy="374" r="14" fill="#155e75"/>
  <text x="546" y="379" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">4</text>
  <text x="570" y="368" fill="#f1f5f9" font-size="13" font-weight="600">确认后安全执行</text>
  <text x="570" y="386" fill="#67e8f9" font-size="11">config_apply → 自动生成 generation</text>

  <line x1="715" y1="400" x2="715" y2="416" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#arrNew)"/>

  <!-- Step 5 -->
  <rect x="520" y="420" width="390" height="52" rx="10" fill="#1e293b" stroke="#155e75" stroke-width="1"/>
  <circle cx="546" cy="446" r="14" fill="#155e75"/>
  <text x="546" y="451" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="700">5</text>
  <text x="570" y="440" fill="#f1f5f9" font-size="13" font-weight="600">一键回滚</text>
  <text x="570" y="458" fill="#67e8f9" font-size="11">rollback_apply → 秒级恢复到任意 generation</text>

  <!-- Benefits -->
  <rect x="520" y="490" width="390" height="90" rx="10" fill="#1e293b" stroke="#166534" stroke-width="1"/>
  <text x="715" y="512" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">💡 优势</text>
  <text x="538" y="532" fill="#94a3b8" font-size="11">• AI 自动化，人只需确认</text>
  <text x="538" y="550" fill="#94a3b8" font-size="11">• 变更前预览 + 风险评估</text>
  <text x="538" y="568" fill="#94a3b8" font-size="11">• Generation 级回滚，精确到秒</text>

  <!-- ===== Bottom: Key Insight ===== -->
  <rect x="140" y="600" width="680" height="100" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="480" y="628" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">核心转变</text>

  <text x="245" y="656" text-anchor="middle" fill="#f87171" font-size="12" font-weight="600">人 → 系统</text>
  <text x="245" y="674" text-anchor="middle" fill="#94a3b8" font-size="10">经验驱动、手动操作</text>

  <line x1="340" y1="660" x2="620" y2="660" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrX)"/>
  <text x="480" y="652" text-anchor="middle" fill="#64748b" font-size="10">nix-evo</text>

  <text x="715" y="656" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="600">人 → AI → 系统</text>
  <text x="715" y="674" text-anchor="middle" fill="#94a3b8" font-size="10">声明式、可预览、可回滚</text>
</svg>
